version: "3.9"

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ${WORKSPACE}/qa-adv-4-dockerbasic:/app
    command: sh -lc "echo '=== CONTAINER DEBUG ===' && pwd && ls -la && echo '=== END DEBUG ===' && npm install && npm test"
    #command: sh -lc "echo '=== CONTAINER DEBUG ===' && cd ${WORKSPACE}/qa-adv-4-dockerbasic && ls -la && echo '=== END DEBUG ===' && npm install && npm test"
    tty: true
    stdin_open: true
