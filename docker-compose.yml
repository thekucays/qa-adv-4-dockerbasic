version: "3.9"

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      # - .:/app
      - /projects:/app
    # command: sh -lc "echo '=== CONTAINER DEBUG ===' && pwd && ls -la ${WORKSPACE} && echo '=== END DEBUG ===' && npm install && npm test"
    command: sh -lc "echo '=== CONTAINER DEBUG ===' && pwd && ls -la /app && echo '=== END DEBUG ===' && npm install && npm test"
    # If you need interactive debugging:
    tty: true
    stdin_open: true
