version: "3.9"

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "echo '=== CONTAINER DEBUG ===' && pwd && cp -r ${WORKSPACE}/. /app && ls -la && echo '=== END DEBUG ===' && npm install && npm test"
    tty: true
    stdin_open: true
